name: Repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown:
    name: Check Markdown files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Check Markdown files are non-empty
        shell: bash
        run: |
          set -euo pipefail
          find . -type f -name '*.md' -not -path './.git/*' -print0 |
            while IFS= read -r -d '' file; do
              test -s "$file"
            done
          echo "Markdown files are present and non-empty."

  session-lab-tests:
    name: Session lab unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/session-auth-api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run unit tests
        run: npm test
